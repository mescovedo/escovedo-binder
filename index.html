<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101728">
<title>Escovedo Binder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
:root{
  --ink:#101728;          /* capa do binder */
  --ink-2:#18213a;        /* painel */
  --pocket:#1e2946;       /* bolso vazio */
  --edge:rgba(255,255,255,.09);
  --text:#e8ecf6;
  --dim:#8a95b2;
  --have:#3ddc97;         /* tenho */
  --act:#ffb648;          /* acao */
  --danger:#ff6b6b;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior-y:contain;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hide{display:none!important}

/* ---------- topo ---------- */
header{
  position:sticky;top:0;z-index:20;background:rgba(16,23,40,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--edge);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
}
.bar{display:flex;align-items:center;gap:12px;min-height:34px}
.bar h1{
  margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.icon{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  border-radius:10px;border:1px solid var(--edge);font-size:17px;line-height:1;
}
.icon:active{background:var(--ink-2)}

/* ---------- progresso ---------- */
.prog{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{display:block;height:100%;background:var(--have);transition:width .3s}
.count{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}

main{padding:var(--pad);max-width:640px;margin:0 auto}

/* ---------- menu ---------- */
.hero{padding:34px 2px 26px;border-bottom:1px solid var(--edge);margin-bottom:22px}
.hero .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--act);font-weight:600}
.hero h2{
  margin:10px 0 0;font-size:clamp(30px,9vw,40px);font-weight:750;
  letter-spacing:-.035em;line-height:1.02;
}
.hero h2 span{display:block;color:var(--dim);font-weight:350}
.hero .stat{margin-top:18px;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.hero .stat b{color:var(--have);font-weight:650}
.tiles{display:flex;flex-direction:column;gap:12px}
.tile{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:20px 18px;border-radius:16px;background:var(--ink-2);
  border:1px solid var(--edge);position:relative;
}
.tile:active{transform:scale(.99);border-color:var(--act)}
.tile .g{
  width:46px;height:46px;flex:none;border-radius:12px;background:var(--pocket);
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px;
}
.tile .g i{background:rgba(255,255,255,.14);border-radius:2px}
.tile .g i.k{background:var(--have)}
.tile .g.plus{place-items:center;display:grid;grid-template-columns:1fr;font-size:24px;color:var(--act);padding:0}
.tile .l b{display:block;font-size:17px;font-weight:600;margin-bottom:2px}
.tile .l small{color:var(--dim);font-size:13px}
.tile .go{margin-left:auto;color:var(--dim);font-size:20px}

/* ---------- lista de binders ---------- */
.shelf{display:flex;flex-direction:column;gap:10px}
.binder{
  display:block;width:100%;text-align:left;padding:15px 16px;border-radius:14px;
  background:var(--ink-2);border:1px solid var(--edge);position:relative;overflow:hidden;
}
.binder:active{transform:scale(.99)}
.binder::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--act)}
.binder.dex::before{background:var(--have)}
.binder .t{font-size:17px;font-weight:600;margin-bottom:3px}
.binder .s{font-size:13px;color:var(--dim);margin-bottom:10px}
.newb{
  width:100%;padding:15px;border-radius:14px;border:1px dashed rgba(255,255,255,.22);
  color:var(--dim);font-weight:500;
}
.newb:active{color:var(--text);border-color:var(--act)}

/* ---------- filtros / paginacao ---------- */
.tools{margin:0 0 14px}
.tools input{margin-bottom:10px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip.tgl[aria-pressed=true]{background:var(--act);color:#241703;border-color:var(--act)}
.sec{margin:0 0 26px}
.sec h3{
  margin:0 0 10px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);font-weight:650;
}
.sec .box{background:var(--ink-2);border:1px solid var(--edge);border-radius:14px;padding:15px 16px}
.sec .box p{margin:0 0 4px;font-size:14px}
.sec .box p:last-child{margin-bottom:0}
.sec .box .k{color:var(--dim);font-size:13px}
.sec .btn{margin-top:10px}
.newset{
  display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--edge);
  font-size:14px;
}
.newset .dt{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.chip{
  padding:7px 14px;border-radius:999px;border:1px solid var(--edge);
  font-size:14px;color:var(--dim);
}
.chip[aria-pressed=true]{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:600}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 4px}
.pager span{font-variant-numeric:tabular-nums;font-size:14px;color:var(--dim);min-width:130px;text-align:center}
.pager button{width:40px;height:40px;border-radius:12px;border:1px solid var(--edge);font-size:18px}
.pager button:disabled{opacity:.25}

/* ---------- a pagina do binder (assinatura) ---------- */
.page{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:10px;border-radius:14px;background:var(--ink-2);border:1px solid var(--edge);
}
.pocket{
  position:relative;aspect-ratio:63/88;border-radius:8px;overflow:hidden;
  background:var(--pocket);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -8px 18px rgba(0,0,0,.28);
  display:grid;place-items:center;text-align:center;padding:6px;
}
.pocket img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:filter .25s}
.pocket:not(.on) img{filter:grayscale(1) contrast(.92) brightness(.62)}
.pocket .badge{
  position:absolute;left:4px;top:4px;z-index:2;background:rgba(16,23,40,.86);
  color:var(--dim);font-size:9px;font-weight:700;letter-spacing:.04em;
  padding:2px 5px;border-radius:5px;text-transform:uppercase;
}
.pocket.on .badge{color:var(--have)}
.pocket .cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:4px 3px 3px;
  background:linear-gradient(transparent,rgba(10,14,26,.92));
  font-size:9.5px;line-height:1.15;color:var(--dim);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.pocket .num{
  font-size:clamp(20px,7vw,30px);font-weight:800;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;color:rgba(255,255,255,.16);line-height:1;
}
.pocket .nm{
  font-size:10px;color:var(--dim);margin-top:5px;line-height:1.2;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.pocket.on{box-shadow:inset 0 0 0 2px var(--have)}
.pocket.on::after{
  content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-radius:50%;
  background:var(--have);box-shadow:0 0 0 2px rgba(16,23,40,.75)
}
.pocket:active{filter:brightness(1.15)}
.empty{padding:40px 10px;text-align:center;color:var(--dim);font-size:14px}

/* ---------- bottom sheet ---------- */
.sheet{
  position:fixed;inset:0;z-index:40;background:rgba(6,9,18,.6);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-in{
  width:100%;max-width:640px;max-height:88vh;background:var(--ink-2);
  border-radius:18px 18px 0 0;border-top:1px solid var(--edge);
  display:flex;flex-direction:column;animation:up .22s ease-out;
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet-hd{
  padding:16px var(--pad) 12px;border-bottom:1px solid var(--edge);
  display:flex;align-items:center;gap:12px;flex:none;
}
.sheet-hd b{flex:1;font-size:16px;font-weight:600}
.sheet-bd{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:var(--pad)}
input[type=text],input[type=search]{
  width:100%;padding:12px 14px;border-radius:11px;background:var(--pocket);
  border:1px solid var(--edge);color:var(--text);font:inherit;
}
input:focus-visible,button:focus-visible,.pocket:focus-visible{outline:2px solid var(--act);outline-offset:2px}
.btn{
  display:block;width:100%;padding:13px;border-radius:11px;text-align:center;
  font-weight:600;background:var(--act);color:#241703;margin-top:10px;
}
.btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--text)}
.btn.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5}

/* resultados de busca */
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 4px;border-bottom:1px solid var(--edge);
}
.row .th{width:40px;height:56px;border-radius:5px;background:var(--pocket);flex:none;object-fit:cover}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{color:var(--dim);font-size:12.5px}
.row .tick{color:var(--have);font-size:18px}
.row .chk{
  width:23px;height:23px;flex:none;border-radius:7px;border:1.5px solid var(--edge);
  display:grid;place-items:center;font-size:13px;color:transparent;
}
.row.sel .chk{background:var(--have);border-color:var(--have);color:#0b1a12}
.sheet-ft{padding:12px var(--pad);border-top:1px solid var(--edge);flex:none}
.sheet-ft .btn{margin-top:0}
.hero .ver{margin-top:9px;font-size:11.5px;color:var(--dim);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.note{color:var(--dim);font-size:13px;line-height:1.5;margin:10px 0 0}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
  background:var(--text);color:var(--ink);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.45);max-width:88vw;text-align:center;
}
.boot{display:grid;place-items:center;height:70vh;color:var(--dim);gap:14px;text-align:center;padding:20px}
.spin{width:26px;height:26px;border:3px solid var(--edge);border-top-color:var(--act);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="boot" class="boot"><div class="spin"></div><div>Carregando as cartas…</div></div>
<div id="app" class="hide">
  <header>
    <div class="bar">
      <button id="back" class="icon hide" aria-label="Voltar">‹</button>
      <h1 id="title">Escovedo Binder</h1>
      <button id="menu" class="icon" aria-label="Ajustes">⋯</button>
    </div>
    <div id="sub" class="hide" style="margin-top:9px">
      <div class="prog"><i id="bar"></i></div>
      <div id="cnt" class="count" style="margin-top:5px"></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
'use strict';
const APP_VERSION='2026.08.17-4';
const IMG_BASE='https://images.pokemontcg.io/';
const PER_PAGE=9;
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};

/* ================= armazenamento local (IndexedDB) ================= */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('binder',1);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('img'))d.createObjectStore('img');};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
const idb=(store,mode,fn)=>new Promise((res,rej)=>{
  const t=db.transaction(store,mode),q=fn(t.objectStore(store));
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
});
const kvGet=k=>idb('kv','readonly',s=>s.get(k));
const kvPut=(k,v)=>idb('kv','readwrite',s=>s.put(v,k));

/* ================= estado ================= */
let CARDS=[],SETS={},DEX=[],BY_DEX=new Map(),BY_KEY=new Map();
let BUILT='',EXTRA={sets:{},cards:[],at:0};
const DATA_REPO='https://raw.githubusercontent.com/PokemonTCG/pokemon-tcg-data/master/';

function reindex(){
  BY_DEX=new Map();BY_KEY=new Map();
  for(const c of CARDS){
    BY_KEY.set(c[0],c);
    for(const n of c[5]){
      if(!BY_DEX.has(n))BY_DEX.set(n,[]);
      BY_DEX.get(n).push(c);
    }
  }
  for(const list of BY_DEX.values())
    list.sort((a,b)=>((SETS[a[2]]||[])[2]||'').localeCompare((SETS[b[2]]||[])[2]||''));
}
function latestSet(){
  let best=null;
  for(const id in SETS)if(!best||SETS[id][2]>SETS[best][2])best=id;
  return best;
}
function fmtDate(d){const m=/^(\d{4})[/-](\d{2})[/-](\d{2})/.exec(d||'');return m?`${m[3]}/${m[2]}/${m[1]}`:'—';}

/* converte uma carta crua do repositorio para o formato enxuto do app */
function slimCard(raw,setId){
  const pk=raw.nationalPokedexNumbers;
  if(!pk||!pk.length)return null;
  return [setId+'-'+raw.number,raw.name,setId,String(raw.number),raw.rarity||'',pk];
}
let S={v:1,dex:{},binders:[],prefs:{showSet:false}};
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>kvPut('state',S).catch(()=>toast('Não consegui salvar')),250);}

/* ================= imagens: baixa uma vez, guarda pra sempre ================= */
const memo=new Map();
let corsOK=true;
function imgUrl(setId,number){return IMG_BASE+setId+'/'+encodeURIComponent(number)+'.png';}
async function getImg(url){
  if(memo.has(url))return memo.get(url);
  const p=(async()=>{
    try{
      const hit=await idb('img','readonly',s=>s.get(url));
      if(hit)return URL.createObjectURL(hit);
    }catch(e){}
    if(!corsOK)return url;
    try{
      const r=await fetch(url,{mode:'cors'});
      if(!r.ok)throw 0;
      const b=await r.blob();
      idb('img','readwrite',s=>s.put(b,url)).catch(()=>{});
      return URL.createObjectURL(b);
    }catch(e){corsOK=false;return url;}
  })();
  memo.set(url,p);return p;
}
function paint(node,setId,number){
  getImg(imgUrl(setId,number)).then(src=>{
    if(!node.isConnected)return;
    const im=new Image();im.decoding='async';im.alt='';
    im.onload=()=>{if(node.isConnected){node.querySelectorAll('img').forEach(x=>x.remove());node.appendChild(im);}};
    im.src=src;
  });
}

/* ================= dados derivados ================= */
function cardsOf(dexNum){return BY_DEX.get(dexNum)||[];}
let DEXNAME=new Map();
function dexName(n){return DEXNAME.get(n)||('#'+n);}
function setLabel(c){const s=SETS[c[2]];return s?s[0]+' · '+c[3]:c[3];}
/* "Prismatic Evolutions (1/131)" - o formato impresso na carta */
function setRef(c){
  const s=SETS[c[2]];
  if(!s)return c[3];
  return `${s[0]} (${c[3]}/${s[3]||'?'})`;
}
/* Um binder guarda espacos (slots), nao Pokemon:
     {s:id, p:numero da pokedex, c:carta escolhida|null, a:1 se "qualquer versao"} */
function slotOwned(b,sl){return sl.a?!!sl.c:!!b.owned[sl.s];}
function binderSlots(b){return b.slots||[];}
function binderStats(b){
  const sl=binderSlots(b);
  return {total:sl.length,owned:sl.filter(x=>slotOwned(b,x)).length};
}
function addSlots(b,dexNum,cards,anyMode){
  b.seq=b.seq||0;
  if(anyMode){b.slots.push({s:++b.seq,p:dexNum,c:null,a:1});return 1;}
  const have=new Set(b.slots.filter(x=>!x.a).map(x=>x.c));
  let n=0;
  for(const c of cards){if(have.has(c[0]))continue;b.slots.push({s:++b.seq,p:dexNum,c:c[0],a:0});n++;}
  return n;
}
function dexNumsIn(b){
  const seen=new Map();
  for(const sl of binderSlots(b))if(!seen.has(sl.p))seen.set(sl.p,0);
  for(const sl of binderSlots(b))seen.set(sl.p,seen.get(sl.p)+1);
  return [...seen.entries()];
}
/* migra binders criados no formato antigo (lista de pokemon + owned por carta) */
function migrate(){
  let changed=false;
  if(!S.prefs){S.prefs={showSet:false};changed=true;}
  for(const b of S.binders){
    if(b.slots&&!b.auto){
      /* binder feito antes de existir o modo automatico: considera automatico
         todo Pokemon cujos espacos cobrem exatamente todas as versoes de entao */
      b.auto={};
      for(const [n] of dexNumsIn(b)){
        const fixed=b.slots.filter(x=>!x.a&&x.p===n).length;
        if(fixed&&fixed===cardsOf(n).length)b.auto[n]=1;
      }
      changed=true;
    }
    if(b.slots)continue;
    changed=true;b.seq=0;b.slots=[];
    const oldOwned=b.owned||{};b.owned={};
    b.auto={};
    for(const n of (b.pokemon||[])){
      b.auto[n]=1;
      for(const c of cardsOf(n)){
        const sl={s:++b.seq,p:n,c:c[0],a:0};b.slots.push(sl);
        if(oldOwned[c[0]])b.owned[sl.s]=1;
      }
    }
    delete b.pokemon;
  }
  return changed;
}

/* ================= navegacao ================= */
let route={name:'menu'};
const BACK={list:'menu',dex:'list',binder:'list',config:'menu'};
function go(r){route=r;render();window.scrollTo(0,0);}
function backTo(){return route.from||{name:BACK[route.name]||'menu'};}
$('#back').onclick=()=>go(backTo());
window.addEventListener('popstate',()=>{if(route.name!=='menu')go(backTo());});

/* ================= telas ================= */
function render(){
  const v=$('#view');v.innerHTML='';
  if(route.name==='menu')return menu(v);
  if(route.name==='list')return binderList(v);
  if(route.name==='dex')return binderView(v,'dex');
  if(route.name==='binder')return binderView(v,route.id);
  if(route.name==='config')return config(v);
}

/* ================= configurações ================= */
function config(v){
  $('#title').textContent='Configurações';
  $('#back').classList.remove('hide');
  $('#sub').classList.add('hide');

  const from=route.from;
  const b=from&&from.name==='binder'?S.binders.find(x=>x.id===from.id):null;

  /* --- este binder --- */
  if(b||(from&&from.name==='dex')){
    const sec=el('div','sec');
    sec.appendChild(el('h3',null,b?b.name:'Pokédex Nacional'));
    const box=el('div','box');
    const dl=el('button','btn','Baixar as imagens deste binder');
    dl.onclick=()=>downloadImages(dl,from);
    box.appendChild(dl);
    box.appendChild(el('p','k','Deixe rodando no Wi-Fi. Depois abre sem internet.'));
    if(b){
      const nums=dexNumsIn(b);
      if(nums.length){
        const rm=el('button','btn ghost','Remover um Pokémon do binder');
        rm.onclick=()=>removePokemonSheet(b);
        box.appendChild(rm);
      }
      const del=el('button','btn warn','Excluir este binder');
      del.onclick=()=>{
        if(!confirm(`Excluir "${b.name}"? As marcações deste binder serão perdidas.`))return;
        S.binders=S.binders.filter(x=>x.id!==b.id);save();go({name:'list'});
      };
      box.appendChild(del);
    }
    sec.appendChild(box);v.appendChild(sec);
  }

  /* --- base de cartas --- */
  const sec1=el('div','sec');
  sec1.appendChild(el('h3',null,'Base de cartas'));
  const box1=el('div','box');
  const last=latestSet();
  box1.appendChild(el('p',null,`${CARDS.length.toLocaleString('pt-BR')} cartas em ${Object.keys(SETS).length} coleções`));
  box1.appendChild(el('p','k',`Mais recente: ${last?SETS[last][0]:'—'} · ${last?fmtDate(SETS[last][2]):''}`));
  box1.appendChild(el('p','k',EXTRA.at?`Última verificação: ${fmtDate(new Date(EXTRA.at).toISOString().slice(0,10))}`:`Base do app: ${fmtDate(BUILT)}`));
  const chk=el('button','btn','Procurar coleções novas');
  chk.onclick=()=>checkNewSets(chk);
  box1.appendChild(chk);
  box1.appendChild(el('p','k','Busca direto no repositório público de dados. Coleções novas entram sem precisar atualizar o app.'));
  sec1.appendChild(box1);v.appendChild(sec1);

  /* --- backup --- */

    a.download='escovedo-binder-'+new Date().toISOString().slice(0,10)+'.json';

    try{
      const d=JSON.parse(await f.files[0].text());
      if(!d||typeof d!=='object'||!Array.isArray(d.binders))throw 0;
      S=Object.assign({v:1,dex:{},binders:[],prefs:{showSet:false}},d);

  sec3.appendChild(el('h3',null,'App'));
  const box3=el('div','box');
  box3.appendChild(el('p',null,'Escovedo Binder'));
  box3.appendChild(el('p','k','Versão '+APP_VERSION));
  const upd=el('button','btn ghost','Buscar atualização do app');
  upd.onclick=async()=>{
    upd.disabled=true;upd.textContent='Procurando…';
    try{
      if('serviceWorker' in navigator){
        const reg=await navigator.serviceWorker.getRegistration();
        if(reg)await reg.update();
      }
      for(const k of await caches.keys())await caches.delete(k);
      toast('Recarregando com a versão nova');
      setTimeout(()=>location.reload(),700);
    }catch(e){upd.disabled=false;upd.textContent='Buscar atualização do app';toast('Sem internet agora');}
  };
  box3.appendChild(upd);
  box3.appendChild(el('p','k','O app se atualiza sozinho ao abrir com internet. Este botão força na hora.'));
  sec3.appendChild(box3);v.appendChild(sec3);

/* ================= coleções novas ================= */
async function checkNewSets(btn){
  btn.disabled=true;btn.textContent='Procurando…';
  try{
    const r=await fetch(DATA_REPO+'sets/en.json',{cache:'no-store'});
    if(!r.ok)throw 0;
    const all=await r.json();
    const novos=all.filter(x=>!SETS[x.id]).sort((a,b)=>(a.releaseDate||'').localeCompare(b.releaseDate||''));
    EXTRA.at=Date.now();
    await kvPut('extra',EXTRA);
    btn.disabled=false;btn.textContent='Procurar coleções novas';
    if(!novos.length){toast('Nenhuma coleção nova. Base em dia.');render();return;}
    newSetsSheet(novos);
  }catch(e){
    btn.disabled=false;btn.textContent='Procurar coleções novas';
    toast('Não consegui verificar. Sem internet?');
  }
}

function newSetsSheet(novos){
  const n=novos.length;
  const ok=el('button','btn',`Baixar ${n} coleção${n>1?'ões':''}`);
  const ft=el('div','sheet-ft');ft.appendChild(ok);
  openSheet(`${n} coleção${n>1?'ões nova':' nova'}${n>1?'s':''}`,bd=>{
    bd.appendChild(el('p','note','Só as cartas de Pokémon entram. Depois de baixar, você decide se os binders recebem espaços novos.'));
    novos.forEach(x=>{
      const row=el('div','newset');
      row.appendChild(el('span','dt',fmtDate(x.releaseDate)));
      row.appendChild(el('span',null,`${x.name} · ${x.printedTotal||x.total||'?'} cartas`));
      bd.appendChild(row);
    });
  },ft);
  ok.onclick=async()=>{
    ok.disabled=true;let add=0,falhas=0;
    for(let i=0;i<novos.length;i++){
      const x=novos[i];
      ok.textContent=`Baixando ${i+1} de ${novos.length}…`;
      try{
        const r=await fetch(DATA_REPO+'cards/en/'+x.id+'.json',{cache:'no-store'});
        if(!r.ok)throw 0;
        const raws=await r.json();
        const slim=raws.map(c=>slimCard(c,x.id)).filter(Boolean);
        EXTRA.sets[x.id]=[x.name,x.series||'',x.releaseDate||'',x.printedTotal||x.total||0];
        for(const c of slim)if(!BY_KEY.has(c[0])){EXTRA.cards.push(c);add++;}
      }catch(e){falhas++;}
    }
    EXTRA.at=Date.now();
    await kvPut('extra',EXTRA);
    applyExtra();
    closeSheet();render();
    toast(falhas?`${add} cartas novas · ${falhas} coleção(ões) falharam`:`${add} cartas novas na base`);
    offerAutoFill();
  };
}

function applyExtra(){
  for(const id in EXTRA.sets)SETS[id]=EXTRA.sets[id];
  const known=new Set(CARDS.map(c=>c[0]));
  for(const c of EXTRA.cards)if(!known.has(c[0])){CARDS.push(c);known.add(c[0]);}
  reindex();
}

/* depois de baixar, oferece completar os binders marcados como "todas as versões" */
function offerAutoFill(){
  const plano=[];
  for(const b of S.binders){
    if(!b.auto)continue;
    let faltam=[];
    for(const n of Object.keys(b.auto).map(Number)){
      const have=new Set(b.slots.filter(x=>!x.a&&x.p===n).map(x=>x.c));
      const novas=cardsOf(n).filter(c=>!have.has(c[0]));
      if(novas.length)faltam.push([n,novas]);
    }
    if(faltam.length)plano.push([b,faltam]);
  }
  if(!plano.length)return;
  const tot=plano.reduce((a,[,f])=>a+f.reduce((x,[,l])=>x+l.length,0),0);
  const ok=el('button','btn',`Adicionar ${tot} espaço${tot>1?'s':''}`);
  const ft=el('div','sheet-ft');ft.appendChild(ok);
  openSheet('Cartas novas para seus binders',bd=>{
    bd.appendChild(el('p','note','Estes Pokémon estão marcados como "todas as versões" e ganharam cartas. Os demais ficaram disponíveis para você adicionar à mão quando quiser.'));
    plano.forEach(([b,faltam])=>{
      const h=el('h3',null,b.name);h.style.cssText='margin:16px 0 6px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)';
      bd.appendChild(h);
      faltam.forEach(([n,novas])=>{
        const row=el('div','newset');
        row.appendChild(el('span','dt','+'+novas.length));
        row.appendChild(el('span',null,dexName(n)));
        bd.appendChild(row);
      });
    });
  },ft);
  ok.onclick=()=>{
    let n=0;
    for(const [b,faltam] of plano)for(const [num,novas] of faltam)n+=addSlots(b,num,novas,false);
    save();closeSheet();render();
    toast(`${n} espaços adicionados`);
  };
}

/* ---- estado de visualizacao do binder ---- */
const viewState={filter:'all',page:0,q:''};

function binderView(v,id){
  const isDex=id==='dex';
  const b=isDex?null:S.binders.find(x=>x.id===id);
  if(!isDex&&!b)return go({name:'list'});

  $('#back').classList.remove('hide');
  $('#sub').classList.remove('hide');
  $('#title').textContent=isDex?'Pokédex Nacional':b.name;

  // monta os slots
  let slots;
  if(isDex) slots=DEX.map(([n,nm])=>({dex:n,name:nm,on:!!S.dex[n],key:S.dex[n]}));
  else slots=binderSlots(b).map(sl=>({sl,on:slotOwned(b,sl)}));

  const total=slots.length,owned=slots.filter(s=>s.on).length;
  $('#bar').style.width=(total?owned/total*100:0).toFixed(1)+'%';
  $('#cnt').textContent=`${owned} de ${total}`+(isDex?' Pokémon':' espaços');

  // busca e filtros
  const tools=el('div','tools');
  const q=el('input');q.type='search';q.placeholder='Filtrar por Pokémon…';q.value=viewState.q;
  let qt;
  q.oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{
    viewState.q=q.value;viewState.page=0;render();
    const nq=$('.tools input');if(nq){nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length);}
  },220);};
  tools.appendChild(q);

  const chips=el('div','chips');
  [['all','Todos'],['have','Tenho'],['miss','Falta']].forEach(([k,lbl])=>{
    const c=el('button','chip',lbl);
    c.setAttribute('aria-pressed',viewState.filter===k);
    c.onclick=()=>{viewState.filter=k;viewState.page=0;render();};
    chips.appendChild(c);
  });
  const tg=el('button','chip tgl','Coleção');
  tg.setAttribute('aria-pressed',!!S.prefs.showSet);
  tg.onclick=()=>{S.prefs.showSet=!S.prefs.showSet;save();render();};
  chips.appendChild(tg);
  tools.appendChild(chips);
  v.appendChild(tools);

  const needle=viewState.q.trim().toLowerCase();
  const vis=slots.filter(s=>{
    if(viewState.filter!=='all'&&(viewState.filter==='have')!==s.on)return false;
    if(!needle)return true;
    const n=isDex?s.dex:s.sl.p;
    if(dexName(n).toLowerCase().includes(needle))return true;
    return String(n)===needle;
  });

  if(!vis.length){
    v.appendChild(el('div','empty',
      total===0?'Este binder está vazio.':
      needle?`Nenhum Pokémon com "${viewState.q.trim()}" neste filtro.`:
      viewState.filter==='have'?'Você ainda não marcou nenhuma carta aqui.':'Nada faltando. Binder completo.'));
  }else{
    const pages=Math.ceil(vis.length/PER_PAGE);
    viewState.page=Math.min(viewState.page,pages-1);
    const page=el('div','page');
    for(const s of vis.slice(viewState.page*PER_PAGE,viewState.page*PER_PAGE+PER_PAGE))
      page.appendChild(pocket(s,isDex,b));
    v.appendChild(page);
    v.appendChild(pager(pages));
  }

  if(!isDex){
    const add=el('button','newb','+  Adicionar Pokémon');
    add.style.marginTop='16px';
    add.onclick=()=>pickPokemon(n=>howToCollect(b,n));
    v.appendChild(add);
  }
}

function pocket(s,isDex,b){
  const p=el('button','pocket'+(s.on?' on':''));
  p.setAttribute('aria-pressed',s.on);

  if(isDex){
    p.setAttribute('aria-label',`#${s.dex} ${s.name}`);
    if(s.on&&s.key){
      const c=BY_KEY.get(s.key);
      if(c){paint(p,c[2],c[3]);if(S.prefs.showSet)p.appendChild(el('div','cap',setRef(c)));}
    }else{
      p.appendChild(el('div','num',String(s.dex).padStart(3,'0')));
      p.appendChild(el('div','nm',s.name));
    }
    p.onclick=()=>versionSheet({
      title:`#${String(s.dex).padStart(3,'0')} ${s.name}`,dex:s.dex,current:s.key,
      onPick:k=>{S.dex[s.dex]=k;},onClear:()=>{delete S.dex[s.dex];},
      clearLabel:'Desmarcar este Pokémon'
    });
    return p;
  }

  const sl=s.sl,nm=dexName(sl.p);

  if(sl.a){                                  // espaco de "qualquer versão"
    const shown=sl.c||(cardsOf(sl.p)[0]||[])[0];
    const c=shown?BY_KEY.get(shown):null;
    if(c)paint(p,c[2],c[3]); else p.appendChild(el('div','num',String(sl.p).padStart(3,'0')));
    p.appendChild(el('div','badge','qualquer'));
    p.appendChild(el('div','cap',sl.c&&c&&S.prefs.showSet?setRef(c):nm));
    p.setAttribute('aria-label',nm+' — qualquer versão'+(s.on?' (tenho)':' (falta)'));
    p.onclick=()=>versionSheet({
      title:nm+' — qualquer versão',dex:sl.p,current:sl.c,
      onPick:k=>{sl.c=k;},onClear:()=>{sl.c=null;},
      clearLabel:'Marcar como faltando'
    });
    return p;
  }

  const c=BY_KEY.get(sl.c);                  // espaco de carta especifica
  if(c){
    paint(p,c[2],c[3]);
    if(S.prefs.showSet)p.appendChild(el('div','cap',setRef(c)));
    p.setAttribute('aria-label',c[1]+' — '+setRef(c)+(s.on?' (tenho)':' (falta)'));
  }
  p.onclick=()=>{
    if(b.owned[sl.s])delete b.owned[sl.s];else b.owned[sl.s]=1;
    save();render();
  };
  return p;
}

function pager(pages){
  const w=el('div','pager');
  const prev=el('button',null,'‹'),next=el('button',null,'›');
  const lbl=el('span',null,`Página ${viewState.page+1} de ${pages}`);
  prev.disabled=viewState.page===0;next.disabled=viewState.page>=pages-1;
  prev.setAttribute('aria-label','Página anterior');next.setAttribute('aria-label','Próxima página');
  prev.onclick=()=>{viewState.page--;render();};
  next.onclick=()=>{viewState.page++;render();};
  w.append(prev,lbl,next);return w;
}

/* ---- selecionar versões específicas ---- */
function pickVersions(b,n){
  const nm=dexName(n),list=cardsOf(n);
  const have=new Set(binderSlots(b).filter(x=>!x.a).map(x=>x.c));
  const sel=new Set();
  const ok=el('button','btn','Selecione ao menos uma');
  ok.disabled=true;
  const ft=el('div','sheet-ft');ft.appendChild(ok);
  openSheet(`${nm} — escolher versões`,bd=>{
    bd.appendChild(el('p','note',`${list.length} versões. Toque para selecionar. As que já estão no binder aparecem marcadas.`));
    const wrap=el('div');bd.appendChild(wrap);
    list.forEach(c=>{
      const already=have.has(c[0]);
      const chk=el('div','chk','✓');
      const r=cardRow(c,chk);
      if(already){r.classList.add('sel');r.style.opacity='.5';r.disabled=true;}
      else r.onclick=()=>{
        if(sel.has(c[0])){sel.delete(c[0]);r.classList.remove('sel');}
        else{sel.add(c[0]);r.classList.add('sel');}
        ok.disabled=!sel.size;
        ok.textContent=sel.size?`Adicionar ${sel.size} carta${sel.size>1?'s':''}`:'Selecione ao menos uma';
      };
      wrap.appendChild(r);
    });
  },ft);
  ok.onclick=()=>{
    addSlots(b,n,list.filter(c=>sel.has(c[0])),false);
    save();closeSheet();viewState.page=0;render();
    toast(`${sel.size} espaços adicionados`);
  };
}

/* ---- escolher um Pokémon ---- */
function pickPokemon(onPick){
  openSheet('Adicionar Pokémon',bd=>{
    const inp=el('input');inp.type='search';inp.placeholder='Nome ou número da Pokédex';
    bd.appendChild(inp);
    const out=el('div');out.style.marginTop='8px';bd.appendChild(out);
    const draw=q=>{
      out.innerHTML='';
      q=q.trim().toLowerCase();
      const hits=DEX.filter(([n,nm])=>!q||nm.toLowerCase().includes(q)||String(n)===q).slice(0,60);
      if(!hits.length){out.appendChild(el('p','note','Nenhum Pokémon com esse nome.'));return;}
      hits.forEach(([n,nm])=>{
        const r=el('button','row');
        const m=el('div','m');
        m.appendChild(el('b',null,nm));
        m.appendChild(el('small',null,`#${String(n).padStart(3,'0')} · ${cardsOf(n).length} cartas`));
        r.appendChild(m);
        r.onclick=()=>onPick(n);
        out.appendChild(r);
      });
    };
    draw('');
    let t;inp.oninput=()=>{clearTimeout(t);t=setTimeout(()=>draw(inp.value),140);};
    setTimeout(()=>inp.focus(),80);
  });
}

/* ---- novo binder ---- */
function newBinder(){
  openSheet('Novo binder',bd=>{
    const inp=el('input');inp.type='text';inp.placeholder='Nome do binder';
    bd.appendChild(inp);
    bd.appendChild(el('p','note','Depois de criar, você escolhe os Pokémon. Para cada um dá para colecionar todas as versões, qualquer uma, ou só as que você escolher.'));
    const ok=el('button','btn','Criar binder');
    ok.onclick=()=>{
      const name=inp.value.trim();
      if(!name)return toast('Dê um nome ao binder');
      const b={id:'b'+Date.now(),name,seq:0,slots:[],owned:{},auto:{}};
      S.binders.push(b);save();closeSheet();viewState.page=0;viewState.filter='all';
      go({name:'binder',id:b.id});
    };
    bd.appendChild(ok);
    setTimeout(()=>inp.focus(),80);
  });
}

/* ================= botao de configurações ================= */
$('#menu').onclick=()=>{
  if(route.name==='config')return;
  go({name:'config',from:route});
};

async function downloadImages(btn,from){
  from=from||route;
  const isDex=from.name==='dex';
  let list;
  if(isDex)list=Object.values(S.dex).map(k=>BY_KEY.get(k)).filter(Boolean);
  else{
    const b=S.binders.find(x=>x.id===from.id);
    list=binderSlots(b).map(sl=>BY_KEY.get(sl.c||(cardsOf(sl.p)[0]||[])[0])).filter(Boolean);
  }
  if(!list.length)return toast('Nada para baixar ainda');
  btn.disabled=true;let done=0,fail=0;
  for(const c of list){
    try{await getImg(imgUrl(c[2],c[3]));}catch(e){fail++;}
    done++;btn.textContent=`Baixando ${done} de ${list.length}…`;
  }
  btn.textContent='Imagens salvas neste celular';
  toast(fail?`${done-fail} de ${list.length} baixadas`:`${done} imagens salvas`);
}

/* ================= arranque ================= */
(async function boot(){
  try{
    db=await openDB();
    const [raw,dex,st]=await Promise.all([
      fetch('data/cards.json').then(r=>r.json()),
      fetch('data/pokedex.json').then(r=>r.json()),
      kvGet('state')
    ]);
    void 0;
    SETS=raw.sets;CARDS=raw.cards;DEX=dex;BUILT=raw.built||'';
    reindex();
    try{const e=await kvGet('extra');if(e&&e.sets){EXTRA=e;applyExtra();}}catch(err){}
    for(const [n,nm] of DEX)DEXNAME.set(n,nm);
    if(st)S=Object.assign(S,st);
    if(migrate())kvPut('state',S).catch(()=>{});
    $('#boot').classList.add('hide');
    $('#app').classList.remove('hide');
    render();
    if('serviceWorker' in navigator&&location.protocol==='https:'){
      const had=!!navigator.serviceWorker.controller;
      let reloading=false;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(!had||reloading)return;      // primeira instalacao nao recarrega
        reloading=true;location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(reg=>{
        reg.update().catch(()=>{});
        setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
      }).catch(()=>{});
    }
  }catch(e){
    $('#boot').innerHTML='<div style="max-width:340px"><b style="color:#e8ecf6">Não consegui carregar a base de cartas.</b>'
      +'<p class="note">O app precisa dos arquivos em <code>data/</code> ao lado do index.html, servidos por http(s). '
      +'Abrir o arquivo direto do celular não funciona — publique no GitHub Pages primeiro.</p></div>';
  }
})();
